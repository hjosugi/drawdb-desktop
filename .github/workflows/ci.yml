name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Vitest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Run Vitest coverage suite
        run: npm test

      - name: Add coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            exit 0
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
          const rows = ["lines", "statements", "functions", "branches"]
            .map((key) => `| ${key} | ${summary[key].pct}% | ${summary[key].covered}/${summary[key].total} |`)
            .join("\n");
          console.log("## Coverage");
          console.log("");
          console.log("| Metric | Percent | Covered |");
          console.log("| --- | ---: | ---: |");
          console.log(rows);
          NODE

  icons:
    name: Icon generator runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate default icon set
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_icons.py -o /tmp/icons
          ls -la /tmp/icons

  setup:
    name: Setup wrapper dry run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify setup wrapper (Unix)
        if: runner.os != 'Windows'
        run: ./setup.sh --dry-run

      - name: Verify setup wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\setup.ps1 --dry-run
