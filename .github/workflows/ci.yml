name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Run Vitest coverage suite
        run: npm test

      - name: Add coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            exit 0
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
          const rows = ["lines", "statements", "functions", "branches"]
            .map((key) => `| ${key} | ${summary[key].pct}% | ${summary[key].covered}/${summary[key].total} |`)
            .join("\n");
          console.log("## Coverage");
          console.log("");
          console.log("| Metric | Percent | Covered |");
          console.log("| --- | ---: | ---: |");
          console.log(rows);
          NODE

  icons:
    name: Icon generator runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate default icon set
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_icons.py -o /tmp/icons
          ls -la /tmp/icons

  setup:
    name: Setup wrapper dry run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify setup wrapper (Unix)
        if: runner.os != 'Windows'
        run: ./setup.sh --dry-run

      - name: Verify setup wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\setup.ps1 --dry-run

  tauri-rust:
    name: Tauri overlay Rust gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./overlay/src-tauri -> target"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path overlay/src-tauri/Cargo.toml -- --check

      - name: Check Tauri overlay crate
        run: cargo check --manifest-path overlay/src-tauri/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path overlay/src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

  overlay-build:
    name: Overlay-applied frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay-src

      - name: Checkout base drawDB-App
        uses: actions/checkout@v4
        with:
          repository: khsuzan/drawDB-App
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply overlay and install dependencies
        run: node overlay-src/scripts/setup.mjs --project-dir ../app

      - name: Build frontend
        working-directory: app
        run: npm run build
