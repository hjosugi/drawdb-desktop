name: Release (cross-platform build)

# Builds native installers for Windows, macOS (Intel + Apple Silicon) and Linux,
# including Linux RPM and ARM64 bundles where GitHub-hosted runners are available.
# The Linux x64 RPM artifact is install-smoke-tested in Fedora after the build
# matrix finishes.
#
# How it works: this repo holds the *overlay* (new modules + Tauri config). The
# job clones the base drawDB-App, lays the overlay on top, generates icons,
# installs the extra dependencies, and runs tauri-action to produce bundles.
#
# NOTE: the File-menu wiring lives in three files that must be hand-merged into
# the base (see overlay/src/patches/PATCHES_FULL.md). Point `base_repo` at a fork
# that already has those patches committed to ship the full desktop UX; otherwise
# you still get building installers, just without the new File menu.
#
# Trigger: push a tag like `v1.7.0`, or run manually (workflow_dispatch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      base_repo:
        description: "Base drawDB-App repo (owner/name)"
        default: "khsuzan/drawDB-App"
      base_ref:
        description: "Base repo branch or tag"
        default: "main"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  rust_target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin" }
          - { os: macos-latest,  rust_target: x86_64-apple-darwin,  args: "--target x86_64-apple-darwin" }
          - { os: ubuntu-22.04,      rust_target: "",                         artifact_suffix: "x64",   args: "" }
          - { os: ubuntu-22.04-arm,  rust_target: "",                         artifact_suffix: "arm64", args: "" }
          - { os: windows-latest,    rust_target: "",                         artifact_suffix: "x64",   args: "" }
          # Windows ARM64 builds only NSIS until WiX/MSI ARM64 output has been verified on a real device.
          - { os: windows-11-arm,    rust_target: aarch64-pc-windows-msvc,     artifact_suffix: "arm64", args: "--target aarch64-pc-windows-msvc --bundles nsis" }

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay-src

      - name: Resolve base repo
        shell: bash
        run: |
          echo "BASE_REPO=${{ github.event.inputs.base_repo || 'khsuzan/drawDB-App' }}" >> "$GITHUB_ENV"
          echo "BASE_REF=${{ github.event.inputs.base_ref || 'main' }}" >> "$GITHUB_ENV"

      - name: Checkout base drawDB-App
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BASE_REPO }}
          ref: ${{ env.BASE_REF }}
          path: app

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential libssl-dev file rpm xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Apply overlay and install dependencies
        run: node overlay-src/scripts/setup.mjs --project-dir ../app

      - name: Setup Python (icon generation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate icons
        run: |
          python -m pip install --quiet pillow
          python overlay-src/scripts/generate_icons.py -o app/src-tauri/icons

      - name: Build app and (on tag) publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "drawDB Desktop ${{ github.ref_name }}"
          releaseDraft: true
          releaseBody: "Automated cross-platform build. See HANDOVER.md."
          args: ${{ matrix.args }}

      - name: Upload bundles as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawdb-${{ matrix.os }}-${{ matrix.artifact_suffix || matrix.rust_target || 'native' }}
          path: |
            app/src-tauri/target/**/release/bundle/**/*.dmg
            app/src-tauri/target/**/release/bundle/**/*.app
            app/src-tauri/target/**/release/bundle/**/*.AppImage
            app/src-tauri/target/**/release/bundle/**/*.deb
            app/src-tauri/target/**/release/bundle/**/*.rpm
            app/src-tauri/target/**/release/bundle/**/*.exe
            app/src-tauri/target/**/release/bundle/**/*.msi
          if-no-files-found: ignore
          retention-days: 14

  verify-linux-x64-rpm:
    name: Verify Linux x64 RPM in Fedora
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: drawdb-ubuntu-22.04-x64
          path: rpm-artifact

      - name: Install and remove RPM in Fedora
        shell: bash
        run: |
          set -euo pipefail

          rpm_path="$(find rpm-artifact -type f -name '*.rpm' | sort | head -n 1)"
          if [[ -z "${rpm_path}" ]]; then
            echo "No .rpm found in drawdb-ubuntu-22.04-x64."
            find rpm-artifact -maxdepth 6 -type f -print
            exit 1
          fi

          docker run --rm \
            --volume "${PWD}:/workspace:ro" \
            --workdir /workspace \
            --env RPM_PATH="${rpm_path}" \
            fedora:latest \
            bash -lc '
              set -euo pipefail

              echo "::group::RPM package metadata"
              rpm -qip "${RPM_PATH}"
              echo "::endgroup::"

              echo "::group::RPM package files"
              rpm -qlp "${RPM_PATH}"
              echo "::endgroup::"

              echo "::group::RPM package requirements"
              rpm -qp --requires "${RPM_PATH}"
              echo "::endgroup::"

              package_name="$(rpm -qp --queryformat "%{NAME}\n" "${RPM_PATH}")"
              package_name_lower="$(printf "%s" "${package_name}" | tr "[:upper:]" "[:lower:]")"

              dnf install -y "${RPM_PATH}"
              rpm -q "${package_name}"

              mapfile -t installed_files < <(rpm -ql "${package_name}")
              printf "%s\n" "${installed_files[@]}"

              binary_path=""
              for candidate in \
                "/usr/bin/${package_name}" \
                "/usr/bin/${package_name_lower}" \
                "/usr/bin/drawDB" \
                "/usr/bin/drawdb"
              do
                if [[ -x "${candidate}" ]]; then
                  binary_path="${candidate}"
                  break
                fi
              done

              if [[ -z "${binary_path}" ]]; then
                while IFS= read -r candidate; do
                  if [[ -x "${candidate}" ]]; then
                    binary_path="${candidate}"
                    break
                  fi
                done < <(printf "%s\n" "${installed_files[@]}" | awk "tolower(\$0) ~ /^\/usr\/bin\/.*drawdb/ || /^\/usr\/bin\//")
              fi

              if [[ -z "${binary_path}" ]]; then
                echo "No installed executable was found for ${package_name}."
                exit 1
              fi

              echo "Installed binary: ${binary_path}"
              command -v "$(basename "${binary_path}")"

              dnf remove -y "${package_name}"
              if rpm -q "${package_name}"; then
                echo "${package_name} remained installed after dnf remove."
                exit 1
              fi
            '
