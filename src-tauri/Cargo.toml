[package]
name = "drawdb-desktop"
version = "1.9.0"
description = "drawDB Desktop Edition"
authors = ["drawDB"]
edition = "2021"
rust-version = "1.77.2"

license = "AGPL-3.0-only"
[lib]
name = "drawdb_lib"
# This repository ships desktop binaries only. Mobile library types multiply
# release LTO time and can be restored if Android/iOS targets are introduced.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
